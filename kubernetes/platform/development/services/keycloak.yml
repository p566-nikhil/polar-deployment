apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-keycloak
  labels:
    app: polar-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polar-keycloak
  template:
    metadata:
      labels:
        app: polar-keycloak
    spec:
      containers:
        - name: polar-keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start-dev
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: user
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: password
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 750Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config

---
apiVersion: v1
kind: Service
metadata:
  name: polar-keycloak
spec:
  selector:
    app: polar-keycloak
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080