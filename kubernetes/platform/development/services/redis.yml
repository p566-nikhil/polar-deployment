apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-redis
  labels:
    app: polar-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polar-redis
  template:
    metadata:
      labels:
        app: polar-redis
    spec:
      containers:
        - name: polar-redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: polar-redis
spec:
  selector:
    app: polar-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
